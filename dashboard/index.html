<!DOCTYPE HTML>
<html>
	<head>
		<title>Everloft Dashboard</title>
		<meta name="description" content="Everloft role-based dashboard router." />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#312450" />
		<script>
			(function () {
				var normalizeRole = function (value) {
					return String(value || "")
						.trim()
						.toLowerCase()
						.replace(/[^a-z0-9]+/g, "_")
						.replace(/^_+|_+$/g, "");
				};
				var roleAliases = {
					super_admin: "super_admin",
					superadmin: "super_admin",
					finance_admin: "finance_admin",
					financeadmin: "finance_admin",
					operations_manager: "operations_manager",
					operationsmanager: "operations_manager",
					operations_admin: "operations_manager",
					operationsadmin: "operations_manager",
					opsadmin: "operations_manager",
					tech_admin: "tech_admin",
					techadmin: "tech_admin",
					property_manager: "property_manager",
					propertymanager: "property_manager",
					housekeeping: "housekeeping",
					housekeeping_staff: "housekeeping",
					housekeepingstaff: "housekeeping",
					housekeep01: "housekeeping",
					maintenance: "maintenance",
					maintenance_staff: "maintenance",
					maintenancestaff: "maintenance",
					maint01: "maintenance",
					guest_support: "guest_support",
					guestsupport: "guest_support",
					investor: "investor",
					investor01: "investor",
					property_owner: "property_owner",
					propertyowner: "property_owner",
					owner: "property_owner",
					owner01: "property_owner",
					guest: "guest",
					guest01: "guest",
					customer: "guest"
				};
				var roleToSlug = {
					super_admin: "super-admin",
					finance_admin: "finance-admin",
					operations_manager: "operations-manager",
					tech_admin: "tech-admin",
					property_manager: "property-manager",
					housekeeping: "housekeeping",
					maintenance: "maintenance",
					guest_support: "guest-support",
					property_owner: "property-owner",
					guest: "guest",
					investor: "investor"
				};
				if (sessionStorage.getItem("everloftAuth") !== "1") {
					window.location.replace("/login/");
					return;
				}
				var candidates = [
					sessionStorage.getItem("everloftUserRole"),
					sessionStorage.getItem("everloftUserRoleLabel"),
					localStorage.getItem("everloftLastResolvedRole"),
					sessionStorage.getItem("everloftLoginUsername")
				];
				var resolvedRole = "investor";
				for (var index = 0; index < candidates.length; index += 1) {
					var normalized = normalizeRole(candidates[index]);
					if (!normalized) {
						continue;
					}
					if (roleAliases[normalized]) {
						resolvedRole = roleAliases[normalized];
						break;
					}
					var compact = normalized.replace(/_/g, "");
					if (roleAliases[compact]) {
						resolvedRole = roleAliases[compact];
						break;
					}
					if (normalized.indexOf("maintenance") !== -1 || normalized.indexOf("maint") !== -1 || normalized.indexOf("mnt") !== -1) {
						resolvedRole = "maintenance";
						break;
					}
					if (normalized.indexOf("housekeeping") !== -1 || normalized.indexOf("housekeep") !== -1 || normalized.indexOf("hkp") !== -1) {
						resolvedRole = "housekeeping";
						break;
					}
					if (normalized.indexOf("operations") !== -1 || normalized.indexOf("ops") !== -1) {
						resolvedRole = "operations_manager";
						break;
					}
				}
				var slug = roleToSlug[resolvedRole] || "investor";
				window.location.replace("/dashboard/roles/" + slug + "/");
			})();
		</script>
	</head>
	<body class="dashboard-router-page">
		<noscript>
			<p>JavaScript is required for dashboard routing. Continue to <a href="/login/">login</a>.</p>
		</noscript>
	</body>
</html>
