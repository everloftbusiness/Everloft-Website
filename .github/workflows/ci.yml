name: CI / Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ci / build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    env:
      NODE_ENV: test
      VERCEL_ENV: preview
      DISABLE_BACKGROUND_JOBS: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://synthetic.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.synthetic_anon_key"
      NEXT_PUBLIC_SITE_URL: "https://www.everloft.co.in"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint on Branch Changed Source Files
        run: |
          git fetch origin main || true
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '^web/src/.*\.(ts|tsx|js|jsx)$' | sed 's|^web/||' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting branch-changed source files:"
            echo "$CHANGED_FILES"
            npx eslint $CHANGED_FILES
          else
            echo "No changed source files to lint."
          fi

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Next.js Build Check
        run: npm run build
