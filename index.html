<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everloft | Handled with Purpose.</title>
    <meta name="description" content="Premium Stays. Thoughtfully Managed." />
    <meta http-equiv="refresh" content="0;url=/web" />
    <script>
      window.location.replace("/web");
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .redirect-box {
        text-align: center;
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      a {
        color: #d4af37;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <h2>Loading Everloft...</h2>
      <p>If you are not redirected automatically, <a href="/web">click here to open the new Everloft website</a>.</p>
    </div>
  </body>
</html>
