<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everloft | Handled with Purpose.</title>
    <meta name="description" content="Premium Stays. Thoughtfully Managed." />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        padding: 2.5rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 500px;
      }
      h1 {
        color: #ffffff;
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        font-size: 1rem;
        line-height: 1.5;
      }
      .badge {
        display: inline-block;
        background: rgba(212, 175, 55, 0.15);
        color: #d4af37;
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Everloft Next.js Application</div>
      <h1>Everloft</h1>
      <p>Handled with Purpose. Premium Stays. Thoughtfully Managed.</p>
    </div>
  </body>
</html>
